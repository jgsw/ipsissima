[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsissima-mcp"
version = "0.1.0"
description = "Turn a document into a source an Argdown reconstruction can cite, and check the reconstruction against it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "James Wilson" }]
keywords = ["argdown", "argument", "reconstruction", "pdf", "epub", "philosophy"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]

# pymupdf and pymupdf4llm do the PDF work; rapidocr is NOT optional in practice — without an OCR
# backend, a scanned paper silently converts to its cover page and nothing reports it. See
# eval/CONVERTER-FINDINGS.md.
dependencies = [
  "mcp>=2.0",
  "pymupdf>=1.24",
  "pymupdf4llm>=0.0.17",
  "rapidocr>=1.3",
  "onnxruntime>=1.17",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
zotero = ["pyzotero>=1.5"]

[project.scripts]
ipsissima-mcp = "ipsissima_mcp.server:main"
ipsissima-ingest = "ipsissima_mcp.ingest:main"
ipsissima-check = "ipsissima_mcp.check_argdown:main"
ipsissima-split = "ipsissima_mcp.split_manuscript:main"
ipsissima-paginate = "ipsissima_mcp.paginate:main"

[tool.setuptools.packages.find]
where = ["src"]

# THE BUNDLED ARGDOWN PARSER HAS TO TRAVEL WITH THE PACKAGE. Without this, setuptools ships the
# .py files and silently leaves vendor/argdown-cli.mjs behind -- an install that imports fine and
# cannot check a reconstruction. It is a build artifact of app/build_argdown_shim.mjs, committed
# on purpose so that `pip install .` needs no JavaScript toolchain.
[tool.setuptools.package-data]
ipsissima_mcp = ["vendor/*.mjs"]

# NOT YET THE PROMPTS. `server.py` reads `docs/` by walking up from its own file, which lands
# outside the package once it is installed rather than checked out -- so a non-editable install
# has a parser and no instructions to give the model. That has to be fixed before this is worth
# publishing anywhere; it is a separate change from bundling the parser and is not made here.
