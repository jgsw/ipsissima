[package]
name = "ipsissima"
version = "0.1.0"
description = "Argument reconstruction, read against the text it is of."
edition = "2021"
rust-version = "1.77"

[lib]
name = "ipsissima_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# `watch` is NOT a default feature: without it the plugin compiles with no watch command
# at all, `fs.watch` resolves to nothing, and the manuscript simply never reloads --
# silently, with no error on either side. It gates `notify` and `notify-debouncer-full`.
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
