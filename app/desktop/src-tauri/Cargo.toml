[package]
name = "ipsissima"
version = "0.1.1"
description = "Argument reconstruction, read against the text it is of."
edition = "2021"
rust-version = "1.77"

[lib]
name = "ipsissima_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# `watch` is NOT a default feature: without it the plugin compiles with no watch command
# at all, `fs.watch` resolves to nothing, and the manuscript simply never reloads --
# silently, with no error on either side. It gates `notify` and `notify-debouncer-full`.
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
# THE ONLY THING HERE THAT TOUCHES THE NETWORK, and it runs once, when the reader chooses
# Help ▸ Check for Updates. `rustls` rather than the system TLS on purpose: native-tls wants
# OpenSSL headers on Linux and a different story on each platform, and this crate has already
# spent a release learning what per-platform differences cost.
# `system-proxy` because a good many of the people this is for are on an institutional network
# that has one, and a check that silently fails there looks like "no updates ever".
# ON ONE LINE, AND IT HAS TO BE. TOML does not allow an inline table to span lines, and cargo's
# parser is lenient enough not to mind -- so this built and tested perfectly here and broke all
# three release jobs at once, tauri-action's parser refusing it with "Unterminated inline array".
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
