<!-- The fidelity ladder as a horizontal rule: quotation, paraphrase, compression,
     interpretation, imputation, in the map's own stroke patterns. Used by main.scss for <hr>. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" preserveAspectRatio="none">
  <g stroke="#B9B5A9">
    <line x1="0" y1="6" x2="200" y2="6" stroke-width="2.6"/>
    <line x1="212" y1="6" x2="412" y2="6" stroke-width="1.4" stroke-dasharray="6 2"/>
    <line x1="424" y1="6" x2="624" y2="6" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="636" y1="6" x2="836" y2="6" stroke-width="1.4" stroke-dasharray="2 3"/>
    <line x1="848" y1="6" x2="1000" y2="6" stroke-width="1.2" stroke-dasharray="7 2 1.5 2"/>
  </g>
</svg>
