<!-- Our own header, not minima's, for two reasons. The mark belongs beside the name — the site
     had the identity everywhere but on the page. And minima's nav lists every page that carries
     a `title` in its front matter; on a one-page site the only such page is index.md itself, so
     the header said "Ipsissima" twice, the second time as a link to the page it was already on.
     The mark is brand/favicon.svg inline (see brand/README.md); keep the two in step. -->

  <div class="wrapper">
