# Ipsissima — build the desktop app for macOS, Windows and Linux, and attach it to a release.
#
#
# WHY IT MATTERS THAT THIS EXISTS EARLY. Three platforms cannot be built on one machine, and
# retrofitting CI onto a project that has only ever been built by hand on a Mac is how Windows
# support quietly never happens. The Windows and Linux artifacts are produced from the first
# release, whether or not anyone has yet tested them, so the gap is visible rather than absent.
#
# SIGNING. Left off deliberately. Unsigned builds trigger Gatekeeper on macOS ("Apple could not
# verify…" — right-click, Open) and SmartScreen on Windows. Removing that costs an Apple
# Developer membership and a Windows code-signing certificate; when those exist, add the secrets
# named in the commented block below and nothing else here changes.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS job producing a universal binary, rather than two jobs and two downloads
          # that the reader then has to choose between.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    # EVERY `run` HAPPENS IN app/desktop, which is what the `../` paths below assume. This file
    # was written while it lived at `app/desktop/ci/release.yml` and every relative path in it
    # is relative to THAT. Moved to .github/workflows/ without this, `npm ci --prefix ../` walks
    # out of the repository and the build fails on a path that does not exist.
    defaults:
      run:
        working-directory: app/desktop

    steps:
      - uses: actions/checkout@v7

      # WebKitGTK is the Linux webview, and 4.1 is the one Tauri v2 links against — 4.0 is v1's
      # and produces a link error that reads as a missing package rather than a wrong version.
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # THE SAME TRAP AS `projectPath` BELOW, and it was caught there and missed here.
      # `defaults.run.working-directory` governs `run` steps only, never an ACTION'S INPUTS — so
      # this path is resolved from the repository root, not from app/desktop. Written as
      # `./src-tauri` it pointed at nothing, and the v0.1.0 build died before it compiled a line:
      #
      #     Error: The cwd: /Users/runner/work/ipsissima/ipsissima/src-tauri does not exist!
      #
      # A cache step is the last place anyone looks for a build failure, which is exactly why it
      # is worth the comment: nothing here is about caching.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/desktop/src-tauri -> target"

      # The frontend is built by the Argdown toolchain, not by the desktop folder: the app IS
      # that page. So its dependencies (esbuild, @argdown/core, CodeMirror, docx, markdown-it)
      # have to be installed before anything can be staged.
      #
      # THE ICONS TOO, because the platform set is deliberately not committed — only the
      # 1024px master is (see app/desktop/.gitignore and brand/README.md). Locally `tauri icon`
      # is run by hand after the mark changes; a fresh checkout has only source.png, and
      # tauri's generate_context! fails at MACRO EXPANSION on the missing 32x32.png. The first
      # tag ever cut is what found this: every earlier build ran on a machine that had the
      # generated set lying around.
      - name: Build the frontend
        run: |
          npm ci --prefix ../
          npm ci
          npm run frontend
          node tauri.mjs icon src-tauri/icons/source.png -o src-tauri/icons

      # LEFT AT v0 DELIBERATELY. tauri-action reached v1 in 2026 and this workflow runs only on a
      # tag, so nothing here would exercise a major bump before a real release did. Worth doing —
      # on a throwaway tag, watching all three platforms, rather than on the first one that
      # matters.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment together with a paid Apple Developer membership:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # `defaults.run.working-directory` governs `run` steps only, never an action, so this
          # is where the desktop project has to be named.
          projectPath: app/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Ipsissima ${{ github.ref_name }}"
          # NO VERSION NUMBERS IN HERE. This text is reused verbatim for every tag, so a
          # filename written out in full ("Ipsissima_0.1.0_universal.dmg") is wrong the next time
          # and quietly tells the reader to download something that is not there.
          releaseBody: |
            Ipsissima reads an Argdown reconstruction beside the manuscript itself.

            ## Nothing to install

            Download **`Ipsissima.html`** and double-click it. It works offline in any browser
            and makes no network requests of any kind. Drop a `.argdown` file onto it — or a
            whole folder, which brings the manuscript with it so claims can be laid out by where
            they appear in the text.

            **`Ipsissima.Reader.html`** is the same thing without the editor — the one to send to
            somebody you want to *show* a reconstruction to.

            New to argument maps? Take the walkthrough: it is the first entry under **How to
            use**, runs on whatever you have open, and takes about two minutes.

            ## Or start from a worked example

            Four finished reconstructions, each opening **with the text it was drawn from**, so you
            can follow a claim back to the passage it came from: a paragraph of Darwin, Carroll's
            regress about rules of inference, the Supreme Court on prorogation, and a journal
            article on Williams and Dewey, reproduced by its author. They are at
            [jgsw.github.io/ipsissima](https://jgsw.github.io/ipsissima/#or-start-from-a-worked-example)
            and need nothing installed. Three more journal articles are in
            [`samples/`](https://github.com/jgsw/ipsissima/tree/main/samples).

            ## The application

            Adds what a web page cannot do: open a `.argdown` by double-clicking it, save back in
            place, and reload the manuscript when it changes on disk. The `.dmg` is macOS (Intel
            and Apple Silicon both), the `-setup.exe` is Windows, and the `.deb` and `.AppImage`
            are Linux.

            The macOS and Windows builds are **unsigned**. On macOS, right-click the app and
            choose Open the first time; on Windows, choose "More info" then "Run anyway".

            ## Ipsissima-MCP, for Claude Desktop

            Download the **`.mcpb`** bundle and double-click it. Claude Desktop installs it and
            provisions Python and the dependencies itself. There is nothing to configure: no
            terminal, no virtual environment, no path typed into a JSON file.

            **You also need [Node](https://nodejs.org)** on the machine — any current version.
            The Argdown parser is JavaScript and travels inside the bundle, so there is nothing
            to install *for* it, but something has to run it. If you install Node after the
            bundle, restart Claude Desktop.

            Then ask for what you want in ordinary words — *"turn this PDF into an argument
            map"*. It gets the document into structured Markdown with its paragraphs and page
            numbers intact, and checks the finished reconstruction against its sources word for
            word: every quotation verified character by character, every claim's distance from
            the author's own words recorded.

            It does not reconstruct arguments itself. That judgement belongs to the model, and
            the instructions given to it are served as prompts read off disk, where anyone can
            read and change them.

            **Not Claude-only.** The bundle is Claude Desktop's install format, but the server
            underneath is plain MCP over stdio and any MCP client can run it — install from
            source and point the client at the command. Full instructions, and the install from
            source, are in
            [ipsissima-mcp/README.md](https://github.com/jgsw/ipsissima/blob/main/ipsissima-mcp/README.md#install).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The single-file build ships alongside the installers, because it is the version that
      # needs no download decision, no platform, and no security warning.
      - name: Attach the standalone page
        if: matrix.platform == 'macos-latest'
        run: |
          node ../build_argdown_viewer.mjs --standalone --editor -o "Ipsissima.html"
          node ../build_argdown_viewer.mjs --standalone -o "Ipsissima Reader.html"
          gh release upload "${{ github.ref_name }}" "Ipsissima.html" "Ipsissima Reader.html" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # THE MCP BUNDLE, BUILT ONCE. It is a `uv` bundle -- it declares its dependencies rather
      # than carrying them -- so there is nothing platform-specific in it and three copies would
      # be three identical files racing to overwrite each other. It rides with the macOS job for
      # the same reason the pages above do.
      #
      # This is the install for a reader who does not want a terminal: double-click, and Claude
      # Desktop provisions Python and the dependencies itself.
      - name: Attach the Claude Desktop bundle
        if: matrix.platform == 'macos-latest'
        run: |
          node ../../ipsissima-mcp/build_mcpb.mjs
          gh release upload "${{ github.ref_name }}" \
            ../../ipsissima-mcp/build/ipsissima-mcp-*.mcpb --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
