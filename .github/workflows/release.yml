# Ipsissima — build the desktop app for macOS, Windows and Linux, and attach it to a release.
#
#
# WHY IT MATTERS THAT THIS EXISTS EARLY. Three platforms cannot be built on one machine, and
# retrofitting CI onto a project that has only ever been built by hand on a Mac is how Windows
# support quietly never happens. The Windows and Linux artifacts are produced from the first
# release, whether or not anyone has yet tested them, so the gap is visible rather than absent.
#
# SIGNING. Left off deliberately. Unsigned builds trigger Gatekeeper on macOS ("Apple could not
# verify…" — right-click, Open) and SmartScreen on Windows. Removing that costs an Apple
# Developer membership and a Windows code-signing certificate; when those exist, add the secrets
# named in the commented block below and nothing else here changes.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS job producing a universal binary, rather than two jobs and two downloads
          # that the reader then has to choose between.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    # EVERY `run` HAPPENS IN app/desktop, which is what the `../` paths below assume. This file
    # was written while it lived at `app/desktop/ci/release.yml` and every relative path in it
    # is relative to THAT. Moved to .github/workflows/ without this, `npm ci --prefix ../` walks
    # out of the repository and the build fails on a path that does not exist.
    defaults:
      run:
        working-directory: app/desktop

    steps:
      - uses: actions/checkout@v7

      # WebKitGTK is the Linux webview, and 4.1 is the one Tauri v2 links against — 4.0 is v1's
      # and produces a link error that reads as a missing package rather than a wrong version.
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # THE SAME TRAP AS `projectPath` BELOW, and it was caught there and missed here.
      # `defaults.run.working-directory` governs `run` steps only, never an ACTION'S INPUTS — so
      # this path is resolved from the repository root, not from app/desktop. Written as
      # `./src-tauri` it pointed at nothing, and the v0.1.0 build died before it compiled a line:
      #
      #     Error: The cwd: /Users/runner/work/ipsissima/ipsissima/src-tauri does not exist!
      #
      # A cache step is the last place anyone looks for a build failure, which is exactly why it
      # is worth the comment: nothing here is about caching.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/desktop/src-tauri -> target"

      # The frontend is built by the Argdown toolchain, not by the desktop folder: the app IS
      # that page. So its dependencies (esbuild, @argdown/core, CodeMirror, docx, markdown-it)
      # have to be installed before anything can be staged.
      #
      # THE ICONS TOO, because the platform set is deliberately not committed — only the
      # 1024px master is (see app/desktop/.gitignore and brand/README.md). A fresh checkout has
      # only source.png, and tauri's generate_context! fails at MACRO EXPANSION on the missing
      # 32x32.png. The first tag ever cut is what found this: every earlier build ran on a
      # machine that had the generated set lying around. build_desktop.mjs now regenerates a
      # missing set itself, so `npm run frontend` above already covers it — the explicit line
      # stays because a release is the wrong place to learn that that check has broken.
      - name: Build the frontend
        run: |
          npm ci --prefix ../
          npm ci
          npm run frontend
          node tauri.mjs icon src-tauri/icons/source.png -o src-tauri/icons

      # THE TAG'S OWN MESSAGE IS THE CHANGES SECTION. One source for what a release says
      # about itself, written once at cut time in the annotation, readable forever with
      # `git tag -l`. The checkout is shallow and tag-less, so the tag is fetched by name; a
      # lightweight or empty annotation degrades to an empty section rather than a failure.
      - name: Read the tag message
        shell: bash
        run: |
          git fetch --force --depth=1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          {
            echo "TAG_CHANGES<<IPSISSIMA_EOF"
            git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}"
            echo "IPSISSIMA_EOF"
          } >> "$GITHUB_ENV"

      # LEFT AT v0 DELIBERATELY. tauri-action reached v1 in 2026 and this workflow runs only on a
      # tag, so nothing here would exercise a major bump before a real release did. Worth doing —
      # on a throwaway tag, watching all three platforms, rather than on the first one that
      # matters.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment together with a paid Apple Developer membership:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # `defaults.run.working-directory` governs `run` steps only, never an action, so this
          # is where the desktop project has to be named.
          projectPath: app/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Ipsissima ${{ github.ref_name }}"
          # NO VERSION NUMBERS IN HERE. This text is reused for every tag, so a filename
          # written out in full ("Ipsissima_0.1.0_universal.dmg") is wrong the next time and
          # quietly tells the reader to download something that is not there.
          #
          # TWO HEADINGS, AND ONLY THE FIRST CHANGES. "Changes" is per-release and comes from
          # the tag's annotation (the step above); "What should I install?" is the standing
          # guidance. This body is the FALLBACK — the cut in RELEASING.md pre-creates the draft
          # with the same shape via release_notes.mjs, and on the found-draft path this action
          # only uploads assets and never touches the body (verified in its create-release.ts:
          # a found draft is adopted, not updated).
          releaseBody: |
            Ipsissima reads an Argdown reconstruction beside the manuscript itself.

            ## Changes

            ${{ env.TAG_CHANGES }}

            ## What should I install?

            **Nothing, to try it.** Download **`Ipsissima.html`** and double-click it: it works
            offline in any browser and makes no network requests of any kind. Drop a `.argdown`
            file onto it — or a whole folder, which brings the manuscript with it so claims can
            be laid out by where they appear in the text. **`Ipsissima.Reader.html`** is the
            same thing without the editor — the one to send to somebody you want to *show* a
            reconstruction to. New to argument maps? The walkthrough is the first entry under
            **How to use** and takes about two minutes.

            **Nothing, to read the worked examples.** Four finished reconstructions, each
            opening with the text it was drawn from, are at
            [jgsw.github.io/ipsissima](https://jgsw.github.io/ipsissima/#or-start-from-a-worked-example);
            three more journal articles are in
            [`samples/`](https://github.com/jgsw/ipsissima/tree/main/samples).

            **The desktop application.** Adds what a web page cannot do: open a `.argdown` by
            double-clicking it, save back in place, and reload the manuscript when it changes
            on disk. The `.dmg` is macOS (Intel and Apple Silicon both), the `-setup.exe` is
            Windows, and the `.deb` and `.AppImage` are Linux. The builds are **unsigned**, so
            the first launch is blocked once: on macOS, after dragging Ipsissima to
            Applications, allow it under **System Settings → Privacy & Security → Open Anyway**;
            on Windows, choose "More info" then "Run anyway".
            [Installing Ipsissima](https://github.com/jgsw/ipsissima/blob/main/app/desktop/INSTALL.md)
            shows every dialog before you meet it.

            **Ipsissima-MCP, for Claude Desktop.** Download the **`.mcpb`** bundle and
            double-click it; Claude Desktop installs it and provisions Python and the
            dependencies itself. You also need [Node](https://nodejs.org) on the machine — any
            current version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The single-file build ships alongside the installers, because it is the version that
      # needs no download decision, no platform, and no security warning.
      - name: Attach the standalone page
        if: matrix.platform == 'macos-latest'
        run: |
          node ../build_argdown_viewer.mjs --standalone --editor -o "Ipsissima.html"
          node ../build_argdown_viewer.mjs --standalone -o "Ipsissima Reader.html"
          gh release upload "${{ github.ref_name }}" "Ipsissima.html" "Ipsissima Reader.html" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # THE MCP BUNDLE, BUILT ONCE. It is a `uv` bundle -- it declares its dependencies rather
      # than carrying them -- so there is nothing platform-specific in it and three copies would
      # be three identical files racing to overwrite each other. It rides with the macOS job for
      # the same reason the pages above do.
      #
      # This is the install for a reader who does not want a terminal: double-click, and Claude
      # Desktop provisions Python and the dependencies itself.
      - name: Attach the Claude Desktop bundle
        if: matrix.platform == 'macos-latest'
        run: |
          node ../../ipsissima-mcp/build_mcpb.mjs
          gh release upload "${{ github.ref_name }}" \
            ../../ipsissima-mcp/build/ipsissima-mcp-*.mcpb --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
