# Ipsissima — publish the public site to GitHub Pages.
#
# TWO LANES, ONE PROMISE. The site is a place to try the program, and a visitor who tries it
# should get what a release gives them rather than whatever was pushed twenty minutes ago. But
# the site is also prose, and a typo in index.md should not need a version number. So:
#
#   on a TAG        everything is built from the tag. This run IS the release: `release.yml`
#                   builds the desktop packages on the same trigger from the same commit, so
#                   the try-it page and the download page always describe one version.
#   on a SITE EDIT  (a push to main that touches site/, or a manual run) the page's WORDS come
#                   from main, but the PRODUCT on it — the viewers, the sample pages — is still
#                   built from the latest release tag, in the build step below. A typo fix can
#                   only change the words around the program, never the program.
#
# A SEPARATE WORKFLOW, NOT A JOB IN release.yml, deliberately. The release runs a three-platform
# Tauri matrix that takes tens of minutes and can fail on one platform for reasons that have
# nothing to do with the web page — an unsigned Windows build, a Linux dependency. This needs
# Node and nothing else, finishes in a couple of minutes, and its failing or succeeding says
# something about the site rather than about a cross-compilation.
#
# WHAT IS PUBLISHED IS BUILT HERE, NEVER COMMITTED. See site/build_site.mjs for why.
name: pages

on:
  push:
    tags: ["v*"]
    # These three filters compose because GitHub applies `paths` to BRANCH pushes only and
    # ignores it for tag pushes: every `v*` tag deploys, and a push to main deploys only when
    # it touched the site. Checked against the documented behaviour before being relied on —
    # this is exactly the kind of trigger that fails silently when guessed.
    branches: [main]
    paths: ["site/**"]
  # Still here for a deploy nothing else triggers: republishing after a Pages incident, or
  # checking the site-edit lane without editing the site.
  workflow_dispatch:

# One deployment at a time, and let a newer one win: two tags pushed together should leave the
# site showing the later, not whichever finished last.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because the site-edit lane needs the tags to find the latest
          # release and a worktree of it to build from. The repository is small; the depth
          # saved by a shallow clone is not worth a lane that cannot see its release.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Builds ipsissima.html, ipsissima-reader.html and one page per sample, and writes
      # _data/samples.json for the landing page to list them from. `npm ci` rather than
      # `npm install` so the site is built from the locked versions the tests ran against.
      - name: Assemble the site (release run)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ( cd app && npm ci )
          node site/build_site.mjs

      # The site-edit lane. The release is built in a worktree of its own tag and ONLY its
      # artifacts are copied over; everything else Jekyll sees — index.md, _config.yml, the
      # assets, the favicons — is this checkout of main. build_site.mjs resolves every path
      # from its own location, so run from the worktree it builds the worktree's app against
      # the worktree's samples, which is the point.
      #
      # Before the first release exists there is nothing to pin to, so everything builds from
      # main: at that point main is all there is, and the fallback says so in the log.
      - name: Assemble the site (site-edit run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -z "$TAG" ]; then
            echo "no release tag yet — building everything from main"
            ( cd app && npm ci )
            node site/build_site.mjs
          else
            echo "words from main; the product as of $TAG"
            git worktree add "$RUNNER_TEMP/release" "$TAG"
            ( cd "$RUNNER_TEMP/release/app" && npm ci )
            node "$RUNNER_TEMP/release/site/build_site.mjs"
            mkdir -p site/try site/_data
            cp "$RUNNER_TEMP/release/site/ipsissima.html" \
               "$RUNNER_TEMP/release/site/ipsissima-reader.html" site/
            cp "$RUNNER_TEMP/release/site/try/"*.html site/try/
            cp "$RUNNER_TEMP/release/site/_data/samples.json" site/_data/
          fi

      - uses: actions/configure-pages@v5
        id: pages

      # Jekyll renders index.md and copies the built HTML through untouched. `baseurl` comes from
      # configure-pages rather than _config.yml, so a fork or a custom domain needs no edit.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
