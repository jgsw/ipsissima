# Ipsissima — the whole suite, on every push and pull request.
#
# ONE COMMAND, because that is the promise `run_all_tests.mjs` makes: every suite, each
# printing its own detail, and a non-zero exit if any fails. Running them separately here would
# be a second definition of "the tests" that drifts from the first.
#
# EVERYTHING IS EXPECTED TO PASS, and no failure is allowed through. This file used to carry an
# allowance for one documented fold defect; the defect was fixed on 29 Aug 2026 and the
# allowance outlived it — which made it a hole, since any new failure of that suite would have
# turned the build green. Removed 3 Sep 2026 (docs/values/TENSIONS.md, T2). If a defect must
# ever ship failing again, it goes in KNOWN-ISSUES.md AND an explicit allowance here, and both
# come out the day it is fixed.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pandoc, and librsvg for the export checks
        # librsvg is deliberately NOT the engine that writes the SVG. An export checked only by
        # the browser that produced it passed while being malformed XML.
        run: sudo apt-get update && sudo apt-get install -y pandoc librsvg2-bin

      - name: Install
        run: |
          npm --prefix app ci || npm --prefix app install
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ipsissima-mcp

      # THE BROWSER THE RENDERED-DOM SUITE NEEDS. Without it that suite SKIPS rather than fails,
      # which is right for a developer's checkout and wrong here: on CI a silent skip would mean
      # the one instrument that watches the painted map quietly stopped running.
      - name: Chromium for the rendered-DOM suite
        run: npx --prefix app playwright install --with-deps chromium



      - name: Everything
        id: suite
        # A MISSING BROWSER MUST BE A FAILURE HERE, not the skip a developer's checkout gets. The
        # skip exists so that `npm test` is useful before `playwright install`; on CI it would
        # mean the one instrument watching the painted map had quietly stopped running.
        env:
          IPS_REQUIRE_BROWSER: "1"
        run: node app/run_all_tests.mjs
