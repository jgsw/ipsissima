<!-- Ipsissima mark: one claim box, drawn with the app's fidelity semantics.
     The border enters solid (quotation) and leaves as dash-dot (imputation); the
     dash patterns are scaled from the map's own fidelity ladder. The quotation
     marks are EB Garamond's own U+201C outline (medium weight, SIL OFL),
     thickened with a light stroke for icon duty. brand/README.md says how to
     regenerate the platform icon set and the site favicons from here. -->
